<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — One Day On Earth</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description" content="Contact the One Day On Earth project.">
  <meta name="theme-color" content="#1e3c72">
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="submit.html">Submit</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="earth-info.html">Earth Info</a></li>
    </ul>
  </nav>

  <main>
    <section class="content">
      <h2>Contact</h2>
      <p>If you have questions or want to reach the team, use the form below.</p>

      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
        </div>
        <button type="submit" class="submit-btn">Send</button>
        <div id="contactStatus" aria-live="polite"></div>
      </form>

    </section>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      const status = document.getElementById('contactStatus');
      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, message }),
        });
        const data = await res.json();
        if (data && data.ok) {
          status.textContent = 'Thanks — your message was received.';
          this.reset();
        } else {
          status.textContent = data.error || 'Sorry — there was a problem.';
        }
      } catch (err) {
        status.textContent = 'Network error — try again later.';
      }
    });
  </script>
</body>
</html>
